[package]
name = "spd-validator"
version = "0.1.0-rc1"
edition = "2024"
license = "Apache-2.0"
description = "Reference conformance validator for SPD Format 0.1 RC1"

[lib]
name = "spd_validator"
path = "src/lib.rs"

[[bin]]
name = "spd-validator"
path = "src/bin/spd-validator.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cssparser = "0.35"
hex = "0.4"
jsonschema = { version = "0.33", default-features = false }
percent-encoding = "2.3"
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2"
unicode-normalization = "0.1"
wait-timeout = "0.2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.7"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
