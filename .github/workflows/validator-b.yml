name: Validator B
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".\validator-b[test]"
      - run: python -m pytest validator-b/tests
