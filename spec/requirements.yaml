registryVersion: "0.1-draft"
source: spec/FORMAT_0.1_DRAFT.md
classification:
  AUTOMATED: Deterministically testable by schema or procedural validation.
  PARTIALLY_AUTOMATED: Structural evidence is testable but conformance also requires judgment.
  MANUAL: Requires human evaluation.
  INFORMATIVE_ONLY: Normative project/process direction, not a document-conformance condition.
capabilities:
  Base: {status: normative, requires: []}
  Mapping: {status: normative-when-claimed, requires: [Base, current-fixed-rendition]}
  Fixed-Experimental: {status: experimental, requires: [Base]}
  Accessible: {status: normative-when-claimed, requires: [Base]}
  Archive-Experimental: {status: experimental, requires: [Base, SEALED, current-archive-appropriate-fixed-rendition]}
requirements:
  - {id: SPD-ARCH-001, section: 3, level: SHALL, capability: [Base], subject: document, requirement: "A conforming document has exactly one authoritative semantic representation.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ARCH-002, section: 3, level: SHALL_NOT, capability: [Fixed-Experimental], subject: fixed-rendition, requirement: "A fixed rendition is not an independently editable source of truth.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ARCH-003, section: 4, level: SHALL, capability: [Base], subject: format, requirement: "Stable existing standards are reused where practical.", testability: INFORMATIVE_ONLY, testType: MANUAL}

  - {id: SPD-BASE-001, section: 5, level: SHALL, capability: [Base], subject: package, requirement: "A Format 0.1 Base document uses the EPUB-Compatible Packaging Profile 0.1 and SHALL satisfy applicable container/publication requirements of EPUB 3.3 Recommendation 13 January 2026 except where SPD explicitly imposes a stricter rule.", testability: AUTOMATED, testType: PACKAGE}
  - {id: SPD-BASE-002, section: 5, level: SHALL, capability: [Base], subject: package, requirement: "Whole-publication EPUB conformance is required under the pinned baseline. Every completed EPUBCheck 5.3.0 conformance error or fatal error fails this requirement; specific diagnostic attribution is additive. Warnings alone do not fail it, and tool failure is NOT_TESTED rather than document failure.", testability: AUTOMATED, testType: PACKAGE}
  - {id: SPD-BASE-003, section: 5, level: SHALL_NOT, capability: [Base], subject: package, requirement: "The format does not define a new ZIP dialect.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-BASE-004, section: 6, level: MUST_NOT, capability: [Base], subject: processor, requirement: "A processor MUST distinguish generic semantic compatibility/readability from SPD lifecycle, currentness, integrity, fixed-rendition, Mapping, authentication and transaction verification. Semantic XHTML remains authoritative even in SEALED documents; ordinary EPUB readers are not SPD processors.", testability: MANUAL, testType: MANUAL}
  - {id: SPD-BASE-005, section: 55, level: SHALL, capability: [Base], subject: package, requirement: "A Base package includes navigation, an authoritative XHTML spine, identity metadata, inventory, offline required resources, semantic structure, logical text, and integrity digests.", testability: AUTOMATED, testType: PACKAGE}
  - {id: SPD-BASE-006, section: 5, level: MUST, capability: [Base], subject: package, requirement: "The OCF container contains exactly one rootfile package document, whose spine defines the authoritative semantic reading order.", testability: AUTOMATED, testType: PACKAGE, derivedFrom: A-019}

  - {id: SPD-SEC-001, section: 7, level: MUST_NOT, capability: [Base], subject: content, requirement: "Base MUST NOT contain or depend on executable document code, executable macros, script elements (including inert data blocks), event-handler attributes, executable URLs or document-supplied code paths.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-002, section: 7, level: MUST_NOT, capability: [Base], subject: content, requirement: "Base MUST NOT contain active embedded/application contexts: iframe including srcdoc, object, embed, plugin execution, service-worker dependencies or document-created executable browsing contexts. Host-owned rendering frames are outside document content.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-003, section: 7, level: MUST_NOT, capability: [Base], subject: content, requirement: "Base MUST NOT initiate automatic publication-originated network access or navigation, including fetching, speculative loading, remote preload, prefetch, DNS preconnect, ping and automatic link checking. Explicit host-mediated user hyperlinks are separate.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-004, section: 7, level: MUST_NOT, capability: [Base], subject: font, requirement: "Every automatically loaded font MUST be inventoried and package-local, including optional fonts. Remote font fetching is prohibited; authoritative fonts MUST NOT depend on uncontrolled local() substitution.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-005, section: 7, level: MUST_NOT, capability: [Base], subject: stylesheet, requirement: "Every automatically loaded stylesheet or import MUST be inventoried and package-local, including optional and fallback styling. Remote stylesheet loading is prohibited.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-006, section: 7, level: MUST_NOT, capability: [Base], subject: image, requirement: "Every automatically loaded image or other visual/media resource MUST be inventoried and package-local, including decorative, optional, cursor, mask, filter, tracking and non-authoritative resources.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-007, section: 7, level: MUST_NOT, capability: [Base], subject: svg, requirement: "All SVG contexts, including inline, standalone, image and nested resources, MUST exclude script, events, foreignObject, executable URLs, automatic remote dependencies and active behavior; ordinary static graphics and safe terminating local references remain allowed.", testability: AUTOMATED, testType: SECURITY}
  - {id: SPD-SEC-008, section: 7, level: MUST, capability: [Base], subject: resource, requirement: "Every automatically resolved rendered dependency MUST transitively terminate in verified inventoried package-local resources or valid local fragments. XHTML, CSS, SVG, MathML and nested embedding modes use the same containment policy; import and resource-expansion cycles are prohibited.", testability: AUTOMATED, testType: SECURITY}

  - {id: SPD-SEM-001, section: 8, level: SHALL, capability: [Base], subject: rendition, requirement: "Exactly one authoritative semantic rendition is identified.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-SEM-002, section: 8, level: SHALL, capability: [Base], subject: rendition, requirement: "The authoritative rendition consists of one or more ordered XHTML content documents.", testability: AUTOMATED, testType: PACKAGE}
  - {id: SPD-SEM-003, section: 8, level: SHALL, capability: [Base], subject: spine, requirement: "The package spine defines primary reading order.", testability: AUTOMATED, testType: PACKAGE}
  - {id: SPD-SEM-004, section: 8, level: SHALL, capability: [Base, Accessible], subject: xhtml, requirement: "Native HTML semantics are used where they exist.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-SEM-005, section: 9, level: SHALL, capability: [Base, Accessible], subject: xhtml, requirement: "Semantic XHTML is preferred to accessibility or custom metadata mechanisms.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-SEM-006, section: 9, level: SHALL_NOT, capability: [Base, Accessible], subject: aria, requirement: "ARIA does not replace correct native semantics.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-SEM-007, section: 10, level: MUST_NOT, capability: [Base], subject: content, requirement: "Primary textual or structural content is not independently duplicated in another normative resource.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-SEM-008, section: 10, level: MUST_NOT, capability: [Base], subject: supplemental-data, requirement: "Supplemental structured data does not redefine authoritative textual content.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-SEM-009, section: 18, level: MUST_NOT, capability: [Base, Accessible], subject: math, requirement: "When semantic MathML exists, mathematical meaning is not required to be reconstructed from visual glyph positions.", testability: MANUAL, testType: ACCESSIBILITY}
  - {id: SPD-SEM-010, section: 19, level: SHALL, capability: [Base, Accessible], subject: figure, requirement: "Figure, caption, and reference relationships remain semantic.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-SEM-011, section: 19, level: SHALL_NOT, capability: [Base], subject: figure, requirement: "Fixed coordinates do not define figure-caption-reference relationships.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-SEM-012, section: 20, level: SHALL, capability: [Base, Accessible], subject: table, requirement: "Tables use semantic table structures.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-SEM-013, section: 20, level: SHALL, capability: [Base, Accessible], subject: table, requirement: "Table header relationships are represented semantically rather than inferred only from visual position.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-SEM-014, section: 21, level: MUST_NOT, capability: [Base], subject: relationship-graph, requirement: "A supplemental relationship graph does not unnecessarily duplicate authoritative content.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}

  - {id: SPD-ID-001, section: 11, level: MUST, capability: [Base], subject: document, requirement: "Every document has a persistent canonical lowercase RFC 9562 UUID URN Document ID.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-ID-002, section: 12, level: MUST, capability: [Base], subject: revision, requirement: "Every committed semantic state has an opaque canonical lowercase RFC 9562 UUID URN Revision ID.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-ID-003, section: 12, level: MUST, capability: [Base], subject: revision, requirement: "A change to normative semantic content creates a new Revision ID.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-ID-004, section: 12, level: MUST_NOT, capability: [Base], subject: revision, requirement: "A change only to non-normative cache data does not create a new semantic Revision ID.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-ID-005, section: 13, level: SHALL, capability: [Base], subject: node, requirement: "Every independently addressable semantic object carries a persistent Node ID.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ID-006, section: 14, level: MUST, capability: [Base], subject: node, requirement: "Node IDs are unique in the current authoritative semantic revision.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ID-007, section: 14, level: MUST_NOT, capability: [Base], subject: node, requirement: "Node IDs do not depend on page position, DOM path, visible numbering, or text content.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ID-008, section: 14, level: MUST_NOT, capability: [Base], subject: node, requirement: "A content hash is not used as Node identity.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ID-009, section: 15, level: SHALL, capability: [Base], subject: node, requirement: "A copied node normally receives a new Node ID.", testability: MANUAL, testType: MANUAL}
  - {id: SPD-ID-010, section: 20, level: SHALL, capability: [Base], subject: table-cell, requirement: "Addressable table cells have persistent Node IDs.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-ID-011, section: 15, level: MUST, capability: [Base], subject: editor, requirement: "A conforming editor preserves Node identity according to lineage rules when supplied lineage history is available.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC, derivedFrom: SPD-ID-006}
  - {id: SPD-ID-012, section: 15, level: MUST_NOT, capability: [Base], subject: editor, requirement: "A conforming editor does not knowingly reuse a retired Node ID within supplied lineage history.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC, derivedFrom: SPD-ID-006}
  - {id: SPD-ID-013, section: 15, level: MUST, capability: [Base], subject: validator, requirement: "A standalone validator reports history-dependent persistence and non-reuse checks as NOT_TESTED when lineage history is unavailable; absence of history does not fail Base.", testability: AUTOMATED, testType: SEMANTIC, derivedFrom: SPD-ID-006}

  - {id: SPD-I18N-001, section: 16, level: MUST, capability: [Base], subject: text, requirement: "Semantic text is represented in logical Unicode order.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-I18N-002, section: 16, level: SHALL_NOT, capability: [Base], subject: text, requirement: "Visual placement does not determine semantic ordering.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-I18N-003, section: 16, level: MUST, capability: [Base, Accessible], subject: language, requirement: "The root authoritative XHTML html element has equivalent valid lang and xml:lang values.", testability: AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-I18N-004, section: 16, level: MUST, capability: [Base, Accessible], subject: direction, requirement: "The root authoritative XHTML html element explicitly declares dir ltr or rtl, and nested semantic elements declare direction when it differs from inherited direction.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-I18N-005, section: 17, level: MUST_NOT, capability: [Base], subject: processor, requirement: "A processor does not equate visual left-to-right position with logical reading order.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-I18N-006, section: 17, level: MUST, capability: [Mapping], subject: api, requirement: "Mapping and editing APIs operate on logical text ranges.", testability: AUTOMATED, testType: MAPPING}

  - {id: SPD-ANN-001, section: 23, level: SHALL, capability: [Base], subject: vocabulary, requirement: "The StableNodeSelector vocabulary and namespace are registered before final 0.1 publication.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-ANN-002, section: 23, level: MUST, capability: [Base], subject: selector, requirement: "A lineage-scoped StableNodeSelector contains Document ID and Node ID and omits Revision ID.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-ANN-003, section: 23, level: MUST, capability: [Base], subject: selector, requirement: "A revision-scoped StableNodeSelector contains Document ID, Revision ID, and Node ID.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-ANN-004, section: 27, level: MUST, capability: [Base], subject: annotation, requirement: "Changing an in-package annotation does not create a semantic Revision ID but invalidates a sealed state whose inventory binds that annotation; external annotations evolve independently unless incorporated.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-023}

  - {id: SPD-STATE-001, section: 26, level: MUST_NOT, capability: [Fixed-Experimental], subject: processor, requirement: "A stale fixed rendition is not presented as the current authoritative fixed representation.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-STATE-002, section: 27, level: SHALL, capability: [Base], subject: sealed-state, requirement: "A sealed state binds the semantic Revision ID, normative inventory, any claimed fixed rendition, and any applicable mapping artifact.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-STATE-003, section: 27, level: SHALL, capability: [Base], subject: sealed-state, requirement: "Changing normative semantic content invalidates the sealed state.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-STATE-004, section: 33, level: SHALL, capability: [Fixed-Experimental], subject: fixed-rendition, requirement: "A fixed rendition bound to a sealed revision is immutable for that revision.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-STATE-005, section: 26, level: MUST, capability: [Fixed-Experimental], subject: fixed-rendition, requirement: "A fixed rendition is current only when revision ID, renditionInputDigest, and resource digest match current verified state; otherwise it is stale.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-009}
  - {id: SPD-STATE-006, section: 27, level: MUST, capability: [Base], subject: sealed-state, requirement: "A semantic-only revision may be SEALED; if fixed is present in SEALED it is current.", testability: AUTOMATED, testType: SCHEMA, derivedFrom: A-008}
  - {id: SPD-STATE-007, section: 56, level: MUST, capability: [Mapping], subject: capability, requirement: "A Mapping claim requires a current fixed rendition and a bound mapping artifact; current fixed without Mapping is permitted.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-021}

  - {id: SPD-RES-001, section: 28, level: SHALL, capability: [Base], subject: inventory, requirement: "A document maintains exactly one normative resource inventory.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-RES-002, section: 28, level: MUST, capability: [Base], subject: resource, requirement: "Each inventory entry has a normalized NFC path, media type, byte length, SHA-256 digest, role, and explicit affects array.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-RES-003, section: 28, level: MUST, capability: [Base], subject: inventory, requirement: "The inventory lists every ZIP entry including non-normative caches except the inventory itself and lifecycle state descriptor.", testability: AUTOMATED, testType: INTEGRITY, ambiguity: A-006}
  - {id: SPD-RES-004, section: 28, level: SHALL, capability: [Base], subject: resource, requirement: "Inventory digests cover the exact decompressed bytes returned for the named ZIP entry.", testability: AUTOMATED, testType: INTEGRITY, ambiguity: A-007}
  - {id: SPD-RES-005, section: 28, level: MUST, capability: [Base], subject: resource, requirement: "Each resource explicitly declares whether it affects semantic state, rendering input, both, or neither; role alone is not effect classification.", testability: AUTOMATED, testType: SCHEMA, derivedFrom: A-007}
  - {id: SPD-RES-006, section: 28, level: MUST, capability: [Base], subject: package, requirement: "Any unlisted ZIP entry other than the two self-referential exceptions fails conformance.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-006}

  - {id: SPD-INT-001, section: 29, level: SHALL, capability: [Base], subject: integrity, requirement: "The document provides digest-based integrity verification.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-INT-002, section: 29, level: SHALL, capability: [Base], subject: integrity, requirement: "SHA-256 is supported.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-INT-003, section: 29, level: SHALL, capability: [Base], subject: integrity, requirement: "Integrity detects modification of semantic content, normative styles/assets, mapping, fixed rendition, and state metadata when applicable.", testability: AUTOMATED, testType: INTEGRITY}
  - {id: SPD-INT-004, section: 29, level: MUST, capability: [Base], subject: digest, requirement: "semanticStateDigest is computed by the normative UTF-8 inventory projection over resources whose affects contains semantic.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-007}
  - {id: SPD-INT-005, section: 29, level: MUST, capability: [Base], subject: digest, requirement: "renditionInputDigest is computed by the normative projection over resources affecting semantic or rendering; presentation-only change stales fixed without changing Revision ID.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-007}
  - {id: SPD-INT-006, section: 29, level: MUST, capability: [Base], subject: state, requirement: "descriptorDigest is SHA-256 of RFC 8785 JCS state JSON with descriptorDigest omitted, producing a cycle-free digest graph.", testability: AUTOMATED, testType: INTEGRITY, derivedFrom: A-022}

  - {id: SPD-FIX-001, section: 31, level: SHALL, capability: [Fixed-Experimental], subject: fixed-rendition, requirement: "A fixed rendition identifies its source Revision ID and renditionInputDigest.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-FIX-002, section: 32, level: SHALL_NOT, capability: [Fixed-Experimental], subject: processor, requirement: "A Fixed capability claim is not interpreted as making PDF the permanent normative page model.", testability: MANUAL, testType: MANUAL}
  - {id: SPD-FIX-003, section: 46, level: SHALL_NOT, capability: [Base, Fixed-Experimental], subject: archive, requirement: "PDF/A-4 is not required for Base or ordinary Fixed conformance.", testability: AUTOMATED, testType: PACKAGE}

  - {id: SPD-MAP-001, section: 34, level: SHALL, capability: [Mapping], subject: renderer, requirement: "A processor claiming Mapping emits a mapping artifact during fixed rendering.", testability: AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-002, section: 34, level: SHALL, capability: [Mapping], subject: mapping, requirement: "A mapping is bound to Document ID, Revision ID, and Fixed Rendition ID plus digest.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-MAP-003, section: 35, level: SHALL_NOT, capability: [Mapping], subject: mapping, requirement: "Backward reconstruction is not the required normative mapping-generation method.", testability: MANUAL, testType: MANUAL}
  - {id: SPD-MAP-004, section: 36, level: SHALL_NOT, capability: [Mapping], subject: mapping, requirement: "A mapping does not contain glyph rendering, fonts, drawing operations, line-breaking, or page-layout instructions whose purpose is to recreate layout.", testability: PARTIALLY_AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-005, section: 38, level: SHALL, capability: [Mapping], subject: mapping, requirement: "Mapping statuses enforce fragment and reason cardinalities for MAPPED, PARTIALLY_MAPPED, NOT_VISIBLE, UNMAPPABLE, and UNSUPPORTED.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-MAP-006, section: 38, level: MUST_NOT, capability: [Mapping], subject: mapping, requirement: "A processor does not fabricate geometry to claim full coverage.", testability: PARTIALLY_AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-007, section: 39, level: SHALL, capability: [Mapping], subject: mapping-record, requirement: "Each mapping record identifies generation mechanism or evidence class.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-MAP-008, section: 40, level: SHALL, capability: [Mapping], subject: text-range, requirement: "Mapping text ranges refer to semantic Unicode order.", testability: AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-009, section: 40, level: MUST_NOT, capability: [Mapping], subject: text-range, requirement: "Semantic text is not reordered to match page geometry.", testability: AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-010, section: 41, level: SHALL_NOT, capability: [Mapping, Fixed-Experimental], subject: report, requirement: "Visual, mapping, fixed-text, and fixed-profile fidelity are not treated as interchangeable.", testability: AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-011, section: 56, level: SHALL, capability: [Mapping], subject: mapping, requirement: "A Mapping claim includes valid page identifiers, status, provenance, logical ranges where used, and page-bounded geometry.", testability: AUTOMATED, testType: MAPPING}
  - {id: SPD-MAP-012, section: 36, level: MUST, capability: [Mapping], subject: geometry, requirement: "Mapping geometry uses finite page-local CSS reference pixels with top-left origin, x right, y down, TL-TR-BR-BL quads, and declared rendition-local page dimensions.", testability: AUTOMATED, testType: MAPPING, derivedFrom: A-011}

  - {id: SPD-ACC-001, section: 42, level: SHALL, capability: [Base, Accessible], subject: accessibility, requirement: "Base accessibility is evaluated against the authoritative semantic XHTML rendition.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-ACC-002, section: 43, level: MUST, capability: [Accessible, Fixed-Experimental], subject: fixed-export, requirement: "A standalone fixed export claiming accessibility independently satisfies the accessibility requirements of its fixed format.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY}
  - {id: SPD-ACC-003, section: 43, level: SHALL_NOT, capability: [Accessible, Fixed-Experimental], subject: fixed-export, requirement: "Accessible XHTML is not used to claim that an independently distributed inaccessible PDF is accessible.", testability: MANUAL, testType: MANUAL}
  - {id: SPD-ACC-004, section: 58, level: MUST, capability: [Accessible], subject: document, requirement: "An SPD Accessible 0.1 claim satisfies EPUB Accessibility 1.1 and WCAG 2.2 Level AA, including applicable human evaluation.", testability: PARTIALLY_AUTOMATED, testType: ACCESSIBILITY, derivedFrom: A-014}

  - {id: SPD-PROV-001, section: 48, level: SHALL_NOT, capability: [Base], subject: provenance, requirement: "Prompt transcripts and chain-of-thought are not required portable provenance.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-IMP-001, section: 49, level: SHALL, capability: [Base], subject: imported-semantics, requirement: "Imported semantic information distinguishes asserted source semantics from inferred semantics.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-IMP-002, section: 49, level: MUST_NOT, capability: [Base], subject: importer, requirement: "An importer does not silently upgrade inferred structure to asserted structure.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-IMP-003, section: 50, level: SHALL_NOT, capability: [Base], subject: importer, requirement: "The format does not claim lossless conversion of arbitrary PDF to semantic SPD.", testability: INFORMATIVE_ONLY, testType: MANUAL}

  - {id: SPD-API-001, section: 51, level: SHALL, capability: [Base], subject: format, requirement: "The file format exposes stable structures suitable for a companion transactional API.", testability: PARTIALLY_AUTOMATED, testType: SEMANTIC}
  - {id: SPD-CAP-001, section: 60, level: MUST_NOT, capability: [Base], subject: processor, requirement: "A processor does not silently misrepresent an unsupported capability.", testability: AUTOMATED, testType: SEMANTIC}
  - {id: SPD-CAP-002, section: 54, level: MUST, capability: [Base], subject: capability, requirement: "Documents declare only capability ID and version; normative or experimental status is specification-controlled.", testability: AUTOMATED, testType: SCHEMA, derivedFrom: A-020}
  - {id: SPD-CAP-003, section: 54, level: MUST, capability: [Base], subject: discovery, requirement: "EPUB discovery metadata and the authoritative document-state capability declaration agree exactly.", testability: AUTOMATED, testType: PACKAGE, derivedFrom: A-013}

  - {id: SPD-DISC-001, section: 69, level: MUST, capability: [Base], subject: discovery, requirement: "container.xml contains exactly one link for each required SPD document-state, resource-inventory, and lifecycle-state relationship.", testability: AUTOMATED, testType: PACKAGE, derivedFrom: A-018}
  - {id: SPD-DISC-002, section: 69, level: MUST, capability: [Base], subject: discovery, requirement: "Each SPD descriptor link has the exact provisional relationship token, application/json media type, and a safe path resolving to one existing resource.", testability: AUTOMATED, testType: PACKAGE, derivedFrom: A-018}
  - {id: SPD-DISC-003, section: 69, level: MUST_NOT, capability: [Base], subject: processor, requirement: "Processors do not discover SPD descriptors by filename scanning or guessing.", testability: AUTOMATED, testType: PACKAGE, derivedFrom: A-018}
  - {id: SPD-DISC-004, section: 69, level: MUST, capability: [Base], subject: release, requirement: "Provisional descriptor, capability, schema, and annotation identifiers are replaced by stable project-controlled identifiers before Release Candidate.", testability: INFORMATIVE_ONLY, testType: MANUAL, derivedFrom: A-018}
  - {id: SPD-EXT-001, section: 61, level: SHALL, capability: [Base], subject: extension, requirement: "Extensions use globally unique identifiers or namespaces.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-EXT-002, section: 61, level: SHALL, capability: [Base], subject: extension, requirement: "Each extension declares whether it is required or optional.", testability: AUTOMATED, testType: SCHEMA}
  - {id: SPD-EXT-003, section: 61, level: SHALL, capability: [Base], subject: processor, requirement: "An unknown required extension causes its affected capability to be reported unsupported.", testability: AUTOMATED, testType: SEMANTIC}

  - {id: SPD-TEST-001, section: 63, level: SHALL, capability: [Base], subject: conformance-corpus, requirement: "Conformance development includes multilingual and structurally difficult fixtures.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-TEST-002, section: 63, level: SHALL, capability: [Base], subject: conformance-corpus, requirement: "The normative corpus includes Arabic and mixed-bidirectional text.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-GOV-001, section: 59, level: SHALL, capability: [Archive-Experimental], subject: archive, requirement: "Archive rules are developed separately from Base conformance.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-GOV-002, section: 66, level: SHALL_NOT, capability: [Fixed-Experimental], subject: annex, requirement: "The experimental PDF annex does not alter Base conformance.", testability: INFORMATIVE_ONLY, testType: MANUAL}
  - {id: SPD-GOV-003, section: 67, level: SHALL, capability: [Fixed-Experimental], subject: standardization, requirement: "A fixed media format becomes normative only after the evidence gate in section 67 is met.", testability: INFORMATIVE_ONLY, testType: MANUAL}
