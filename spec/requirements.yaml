  # Pre-RC passive and processor obligations; package PASS never certifies reader behavior.
  - {id: SPD-PASS-001, section: 7, level: SHALL, capability: [Base], subject: content-and-processor, requirement: "SPD Base content is untrusted passive document data and SHALL NOT supply executable application behavior. A Base processor SHALL NOT execute document-supplied code or grant publication-originated application authority.", testability: PARTIALLY_AUTOMATED, testType: SECURITY}
  - {id: SPD-PASS-002, section: 7, level: SHALL, capability: [Base], subject: content, requirement: "Base SHALL obey the normative inert-control/embedded-context profiles: no forms, active contexts, automatic navigation, base overrides or authoritative interactive canvas; preserved controls SHALL be disabled, labeled inert representations without capture, form association, submission or activation behavior.", testability: PARTIALLY_AUTOMATED, testType: SECURITY}
  - {id: SPD-PASS-003, section: 7, level: SHALL, capability: [Base], subject: content-and-processor, requirement: "Base meaning SHALL be complete in a stable static presentation without animation, transitions, autoplay or interactive state changes. Processors SHALL suppress their execution. Local media MAY play only after user action with equivalent accessible semantics available without playback.", testability: PARTIALLY_AUTOMATED, testType: SECURITY}
  - {id: SPD-RS-001, section: 7, level: SHALL, capability: [Base], subject: processor, requirement: "An SPD reader SHALL deny publication-originated network, filesystem, camera, microphone, location, shared-cookie, persistent Web storage and service-worker authority. External HTTP/HTTPS hyperlinks require intentional user action and host mediation without destination access to the document context.", testability: MANUAL, testType: SECURITY}
  - {id: SPD-RS-002, section: 7, level: SHALL, capability: [Base], subject: processor, requirement: "An SPD processor SHALL distinguish displayed semantic content, declared SEALED, verified SEALED/current state and verified current fixed rendition. Unverified views MUST NOT be represented as verified sealed/fixed or authenticated; hash integrity is not signer or issuer authentication.", testability: MANUAL, testType: SECURITY}
